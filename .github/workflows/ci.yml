name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: tmux -V

      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

      - run: npm test
      - run: npm run test:integration
        env:
          TMUX_INTEGRATION: "1"

      # Hard-requirement gates for @promptctl/pane-terminal. These are RED
      # until the pane-terminal-8w9 epic implements PaneStream, sinks, and
      # adapters — the failing output IS the contract (see
      # tmux-pane-terminal-8w9.3 and design-docs/pane-session-v2.md).
      # `continue-on-error: true` so the gate failures annotate the run
      # without blocking merges of intermediate epic steps. Flip to
      # required once gate 7 goes green.
      - name: pane-terminal — bench/test gates (red until 8w9.4–7 land)
        run: npm run -w @promptctl/pane-terminal bench:gate
        env:
          TMUX_INTEGRATION: "1"
        continue-on-error: true
