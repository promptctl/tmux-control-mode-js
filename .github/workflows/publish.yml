name: Publish

# Publishes @promptctl/tmux-control-mode-js to npm when a GitHub Release
# is published. prepublishOnly runs check:deps (guards against runtime
# dep leaks) + build, so the tarball is always built from a clean tree.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm --provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Full CI gate before publishing — if tests fail, the release tag is
      # created but nothing ships.
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm test

      # `--filter` names the target package explicitly so this stays correct
      # if the workspace grows additional publishable packages, and avoids
      # depending on pnpm's cwd-as-package implicit selection at the
      # workspace root (a known footgun across pnpm versions).
      - run: pnpm --filter @promptctl/tmux-control-mode-js publish --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
