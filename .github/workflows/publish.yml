name: Publish

# Publishes @promptctl/tmux-control-mode-js to npm when a GitHub Release
# is published. prepublishOnly runs check:deps (guards against runtime
# dep leaks) + build, so the tarball is always built from a clean tree.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token npm signs the provenance attestation with
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Real tmux for the integration gate below. A release can be cut from
      # any tag/SHA and nothing forces that SHA to have passed CI first, so
      # the publish path re-verifies with real tmux rather than trusting the
      # sibling CI workflow to have run. [LAW:no-ambient-temporal-coupling]
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: tmux -V

      - run: pnpm install --frozen-lockfile

      # Full CI gate before publishing — if any check fails, the release tag
      # is created but nothing ships. This deliberately mirrors CI's
      # verification *including* real-tmux integration (test:integration): the
      # release path must not ship an artifact CI never exercised against a
      # real daemon.
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      # `pnpm test` no longer carries --passWithNoTests: a broken glob or a
      # renamed tests/ dir that collects zero files must fail the publish
      # loudly, not exit 0 green on an untested tarball. [LAW:no-silent-failure]
      - run: pnpm test
      - run: pnpm run test:integration
        env:
          TMUX_INTEGRATION: "1"
      # bench:gate (the g-series perf budgets) is intentionally NOT on the
      # publish path: it is a wall-clock-sensitive perf regression gate, run
      # blocking in CI on every push/PR to master. Re-running it on release
      # would add timing flake to the ship path without covering a distinct
      # correctness risk. Correctness/conformance is covered by test +
      # test:integration above. [LAW:verifiable-goals]

      # `--filter` names the target package explicitly so this stays correct
      # if the workspace grows additional publishable packages, and avoids
      # depending on pnpm's cwd-as-package implicit selection at the
      # workspace root (a known footgun across pnpm versions).
      #
      # Provenance is requested via NPM_CONFIG_PROVENANCE, NOT the
      # `--provenance` CLI flag. pnpm 10 does not implement publish natively —
      # it delegates to the npm CLI — and it silently drops `--provenance`
      # when forwarding, so the flag publishes a no-op (succeeds, attaches no
      # attestation). An env var is inherited by the delegated npm process
      # unconditionally, so npm honors it regardless of pnpm's flag handling.
      # Do NOT "restore" the flag: it is the broken channel, not a missing one.
      # The verify step below fails the job if provenance still doesn't attach.
      - run: pnpm --filter @promptctl/tmux-control-mode-js publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # Provenance verification gate. The publish above can succeed while
      # attaching no provenance attestation (this is exactly how 0.1.0
      # shipped). Assert the SLSA provenance attestation exists rather than
      # trusting the publish exit code.
      #
      # Endpoint contract (verified live): a version WITH provenance returns
      # HTTP 200 + {"attestations":[...]} containing a predicateType of
      # https://slsa.dev/provenance/v1; a version WITHOUT returns HTTP 404
      # {"error":"Not found"}. We poll because the endpoint lags publish by a
      # few seconds, so a 404 may be propagation rather than absence — only a
      # 404 that persists across the whole window is a real failure. Any other
      # status is a registry/network fault and also fails loudly: this gate
      # never passes on an inconclusive result.
      - name: Verify provenance attestation attached
        run: |
          version="$(node -p "require('./package.json').version")"
          url="https://registry.npmjs.org/-/npm/v1/attestations/@promptctl%2Ftmux-control-mode-js@${version}"
          echo "Checking SLSA provenance for @promptctl/tmux-control-mode-js@${version}"
          for attempt in 1 2 3 4 5 6; do
            http="$(curl -sS -o /tmp/attestations.json -w '%{http_code}' "$url")" || http="000"
            if [ "$http" = "200" ]; then
              has_slsa="$(node -e "const d=require('/tmp/attestations.json');process.stdout.write(String((d.attestations||[]).some(a=>(a.predicateType||'').includes('slsa.dev/provenance'))))")"
              if [ "$has_slsa" = "true" ]; then
                echo "✓ SLSA provenance attestation present"
                exit 0
              fi
              echo "attempt ${attempt}: 200 but no SLSA provenance predicateType yet"
            else
              echo "attempt ${attempt}: HTTP ${http} (404 = not yet visible / absent)"
            fi
            sleep 10
          done
          echo "::error::No SLSA provenance attestation for @promptctl/tmux-control-mode-js@${version} after publish (regression of tmux-release-5f2.1)"
          exit 1
