<!doctype html>
<meta charset="utf-8" />
<title>tmux snapshots</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 340px 1fr; background: #1a1b1e; color: #d4d4d4; font: 13px system-ui, sans-serif; }
  aside { display: flex; flex-direction: column; border-right: 1px solid #333; min-height: 0; }
  aside header { padding: 8px; display: grid; gap: 6px; border-bottom: 1px solid #333; }
  input, select { background: #25262b; color: inherit; border: 1px solid #444; border-radius: 4px; padding: 5px 7px; font: inherit; width: 100%; }
  #tree, #results { overflow: auto; flex: 1; padding: 4px 0; }
  .session { padding: 6px 10px 2px; font-weight: 600; color: #8ab4f8; }
  .session small { font-weight: 400; color: #888; }
  .window { padding: 2px 10px 2px 18px; color: #aaa; }
  .pane { padding: 3px 10px 3px 30px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pane:hover, .hit:hover { background: #2a2c33; }
  .pane.sel { background: #36405a; }
  .pane small { color: #888; }
  .hit { padding: 3px 10px; cursor: pointer; border-bottom: 1px solid #25262b; }
  .hit b { color: #8ab4f8; font-weight: 600; }
  .hit span { display: block; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #bbb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #meta { padding: 8px 12px; border-bottom: 1px solid #333; color: #aaa; }
  #meta b { color: #d4d4d4; }
  #screen { flex: 1; overflow: auto; margin: 0; padding: 8px 12px; background: #0f1012; font: 12px/1.35 ui-monospace, Menlo, monospace; }
  #screen div { white-space: pre-wrap; word-break: break-all; min-height: 1.35em; }
  #screen div.flash { background: #5a4a14; }
  .note { padding: 12px; color: #888; }
</style>
<aside>
  <header>
    <select id="snap"></select>
    <input id="q" placeholder="search all scrollback (Enter)" />
    <input id="filter" placeholder="filter sessions / commands / dirs" />
  </header>
  <div id="results" hidden></div>
  <div id="tree"></div>
</aside>
<main>
  <div id="meta" class="note">Pick a pane.</div>
  <div id="screen"></div>
</main>
<script type="module" src="/app.js"></script>
